name: CI

# PULL REQUESTS ONLY. A merge to `main` used to run this AND `release.yml`, and both ran the whole
# suite against the same commit — two runs, one of them pure duplication.
#
# `release.yml`'s first job runs `npm test`, so main and dev are still fully checked; this exists to
# gate the merge. The split is: CI answers "may this land", Release answers "what ships".
#
# EVERY STEP IS AN npm SCRIPT, never inline shell. `npm test` runs exactly what this runs, so a
# laptop cannot be green while CI is red — the property that broke once already, when a drifted lock
# file left every local lane passing while `npm ci` refused to start.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: The lock file agrees with the workspaces
        # `npm ci` above already refuses a drifted lock — this runs anyway so the failure NAMES the
        # workspace instead of printing npm's usage text.
        run: npm run test:lockfile

      - name: The workflow files load, and npm test still equals CI
        # `test:workflows` first: a workflow Actions cannot parse produces a run with ZERO
        # jobs and no logs, which reads like nothing happened rather than like an error.
        run: |
          npm run test:workflows
          npm run test:ci-parity

      - name: Manifest and modules
        run: npm run test:extension

      # This is a PUBLIC repo. It once carried a live VM address, four resolving hostnames, a tunnel
      # UUID and a private profile name — none of it secret, all of it somebody's infrastructure.
      - name: No private infrastructure
        run: npm run test:private

      # The runbook once told you to start the bridge with a variable no code has ever read, so its
      # first command exited 1 for everybody. Docs and config drift apart silently; this compares them.
      - name: Docs and code agree about configuration
        run: npm run test:env

      - name: Tests
        run: |
          npm run test:snapshot
          npm run test:select
          npm run test:registry
          npm run test:guard
          npm run test:popup
          npm run test:package

      - name: Bridge server type-checks
        run: npm run test:bridge

      # `packages/agent` had a `typecheck` script and no caller, so it drifted out of CI's sight: it
      # stopped sending the bearer the MCP face began requiring, and `npm run smoke` — the README's
      # own verification step — 401'd for months with nothing to say so.
      - name: Typecheck the agent
        run: npm run test:agent

      - name: Harnesses (bridge round-trip, multi-profile)
        run: |
          npm run test:mock
          npm run test:profiles

      - name: Package the extension
        # A loadable zip on every PR: what you hand somebody to sideload, and what a Web Store
        # upload takes. The Release attaches its own; this one is for reviewing a change. Built by
        # the SAME script as the Release — one zip, or one per declared build — so what a reviewer
        # sideloads is laid out exactly like what ships.
        id: zip
        run: |
          set -euo pipefail
          node scripts/package-extension.mjs --out "$RUNNER_TEMP/dist"
          V=$(node -p "require('./packages/extension/manifest.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@v5
        with:
          name: extension-${{ steps.zip.outputs.version }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  relay:
    name: Relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # FULL HISTORY. Without it the resolver cannot reach the boundary commit and the preview
          # below fails on every run — a permanent red annotation on a passing build, which is how
          # people learn to ignore annotations.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Type-check and unit tests
        run: npm run test:relay

      - name: Pure logic — version arithmetic and release notes
        # The release path's maths and its rendering should not be first exercised in production.
        run: |
          npm run test:version
          npm run test:notes

      - name: The published tarball actually runs
        run: npm run test:tarball

      - name: What the next release would be
        # Informational. `continue-on-error` because a PR from a FORK cannot read npm's gitHead for
        # a private-ish boundary, and that is not this PR's fault.
        continue-on-error: true
        run: npm run versions
